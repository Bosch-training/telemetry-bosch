name: CICD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-and-test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest --cov=src/telemetry

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .

  pip-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  docker-build:
    name: Docker build (placeholder)
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, pip-audit]
    steps:
      - uses: actions/checkout@v4
      - name: Docker build placeholder
        run: |
          echo "TODO: add Dockerfile and run 'docker build -t telemetry:ci .'"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Write UTC timestamp file on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "ubuntu@${EC2_HOST}" \
            "echo '${TIMESTAMP}' > /home/ubuntu/timestamp.txt"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
